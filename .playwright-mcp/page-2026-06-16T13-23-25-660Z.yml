        - generic [ref=e34]: Our story
        - heading "From a small office, a national mandate." [level=2] [ref=e35]
      - generic [ref=e36]:
        - paragraph [ref=e37]: "Akieni was founded with a single conviction: that Central Africa's next decade depends on locally-built, internationally-credible digital infrastructure · and that the talent to build it is already here."
        - paragraph [ref=e38]: "We have grown to a 45-person team across Engineering, Delivery, Administration and HR, and shipped into production three of the country's most critical platforms: SFEC for the Ministry of Finance, CAMU for universal health coverage, and CNSS for social security. Each was delivered to standards equal to anything you would find in Paris or Lagos · by a team that is 100% African, based on the banks of the Congo river."
