        - generic [ref=e24]: À propos d'Akieni
        - generic [ref=e25]: 02 / Entreprise
      - heading "Qui nous sommes, et ce que nous construisons." [level=1] [ref=e26]:
        - text: Qui nous sommes,
        - text: et ce que nous construisons.
      - paragraph [ref=e28]: Une firme d'ingénierie et de livraison de 45 personnes à Brazzaville, qui construit des technologies à l'échelle nationale pour l'Afrique centrale.
    - generic [ref=e32]:
      - generic [ref=e33]:
        - generic [ref=e34]: Notre histoire
        - heading "D'un petit bureau à un mandat national." [level=2] [ref=e35]
      - generic [ref=e36]:
        - paragraph [ref=e37]: "Akieni a été fondée avec une seule conviction : la prochaine décennie de l'Afrique centrale dépend d'une infrastructure numérique construite localement et crédible à l'international · et le talent pour la bâtir est déjà ici."
        - paragraph [ref=e38]: "Nous sommes passés à une équipe de 45 personnes réparties entre Ingénierie, Livraison, Administration et RH, et avons livré en production trois des plateformes les plus critiques du pays : SFEC pour le Ministère des Finances, CAMU pour la couverture santé universelle, et CNSS pour la sécurité sociale. Chacune a été livrée aux normes équivalentes à ce que l'on trouve à Paris ou à Lagos · par une équipe 100 % africaine, sur les rives du fleuve Congo."
        - generic [ref=e39]:
          - img "Bureau · Brazzaville" [ref=e41]
          - img "Plateau d'ingénierie" [ref=e43]
    - generic [ref=e47]:
